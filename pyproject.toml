[project]
name = "am-at2-redes-neurais"
version = "0.1.0"
description = "AT2 - MLP (Telco Customer Churn) com Pipeline Scikit-Learn e API FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbformat>=5.10",
]
